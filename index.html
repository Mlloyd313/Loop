<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A caddie for the courses you play, built from your own data: lidar elevation, mapped surfaces, your dispersion, the written plans.">
<meta name="color-scheme" content="light dark">
<title>Loop</title>
<meta name="loop-build" content="3af88c3718">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Loop">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="robots" content="noindex, nofollow">
<script>window.LOOP_PHONE = true;</script>

<style>
:root{
  --paper:#ffffff; --panel:#f3f4f2; --panel2:#e9ebe7; --ink:#17191c; --ink2:#4a4f55; --mute:#7c838b; --rule:#d9dcd6;
  --engine:#c8102e; --plan:#2457c5; --ok:#2f8f46;
  --fw:#6fbf5a; --rough:#3f7a3a; --sand:#ead27d; --water:#4f93dd; --desert:#cdb08a; --green:#2ecc71;
  --font:"Segoe UI Variable Text","Segoe UI",-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;
  --num:Bahnschrift,"Segoe UI Variable Display","Roboto Condensed","Arial Narrow",-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#121416;--panel:#1b1e21;--panel2:#24282c;--ink:#eceef0;--ink2:#b8bec5;--mute:#8a9199;--rule:#2d3237;--engine:#ff4d63;--plan:#6c9bff;--ok:#5ccf7a;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121416;--panel:#1b1e21;--panel2:#24282c;--ink:#eceef0;--ink2:#b8bec5;--mute:#8a9199;--rule:#2d3237;--engine:#ff4d63;--plan:#6c9bff;--ok:#5ccf7a;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.45 var(--font)}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:1px solid var(--rule);border-radius:6px;padding:6px 10px}
button:hover{border-color:var(--ink2)}
button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--engine);outline-offset:2px}
a{color:inherit}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}
/* The header sticks at 0 and owns the status-bar band itself: padding = the safe-area inset, painted dark so the clock reads in both themes.
   Sticking at top:env(...) instead left the stuck header 59 px below its layout slot on a home-screen app, covering the map's tool row. */
header{position:sticky;top:0;z-index:5;padding-top:env(safe-area-inset-top,0px);background:var(--paper);background:linear-gradient(to bottom,#173d26 env(safe-area-inset-top,0px),var(--paper) 0);border-bottom:1px solid var(--rule)}
.bar{display:flex;align-items:center;gap:14px;padding:10px 16px;flex-wrap:wrap}
.wordmark{font-family:var(--num);font-weight:700;font-size:22px;letter-spacing:.02em;margin-right:4px}
.wordmark small{display:block;font:12px/1.2 var(--font);color:var(--mute);font-weight:400;letter-spacing:0}
select.course{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:7px 10px;font-weight:600;max-width:60vw}
nav.views{display:flex;gap:2px;margin-left:auto;background:var(--panel);border-radius:8px;padding:3px}
nav.views button{border:0;padding:6px 12px;border-radius:6px;color:var(--ink2)}
nav.views button[aria-current="page"]{background:var(--paper);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.cond{display:flex;gap:8px;align-items:center;color:var(--ink2);font-size:13px;border:1px solid transparent;border-radius:6px;padding:5px 8px}
.cond:hover{border-color:var(--rule)} .cond[aria-expanded="true"]{background:var(--panel)}
.quick{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:6px 16px 10px;font-size:13.5px;color:var(--ink2)}
.quick label{display:flex;gap:6px;align-items:center}
.quick input,.quick select{padding:4px 6px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}
.hint{margin:0 0 12px;padding:10px 14px;background:var(--panel);border-radius:8px;font-size:13.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:12px;align-items:center}
.hint button{padding:3px 8px;font-size:12px}
@media (max-width:860px){.wordmark small{display:none}.wordmark{font-size:20px}.bar{padding:8px 12px}.holes{padding:0 12px 8px}main{padding:12px 12px 60px}}
@media (max-width:560px){.wordmark{display:none}nav.views .long{display:none}nav.views button{text-transform:none}nav.views button[data-view=audit]::first-letter{text-transform:uppercase}.bar{gap:6px 10px;padding:6px 12px}select.course{max-width:none;flex:1;padding:5px 8px;font-size:14px}.cond{font-size:12px;padding:3px 6px;gap:6px}nav.views button{padding:4px 6px;font-size:13px}.holes{padding:0 12px 6px;gap:3px}.holes button{min-width:34px;font-size:13px;padding:4px 0}.holes button small{font-size:9px}}
.holes{display:flex;gap:4px;padding:0 16px 10px;overflow-x:auto;scrollbar-width:thin}
.holes button{flex:none;min-width:40px;padding:5px 0;border-radius:6px;border:1px solid var(--rule);font-family:var(--num);font-size:15px;line-height:1;background:var(--paper)}
.holes button small{display:block;font:10px/1.3 var(--font);color:var(--mute)}
.holes button[aria-current="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.holes button[aria-current="true"] small{color:var(--panel2)}
main{padding:14px 16px 60px;max-width:1500px;margin:0 auto}
.hole{display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr);gap:22px;align-items:start}
.hole>*{min-width:0}
.tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:860px){.hole{grid-template-columns:minmax(0,1fr)}.bar{gap:10px}nav.views{margin-left:0;width:100%}nav.views button{flex:1}}
.mapwrap{position:relative;background:var(--panel);border-radius:10px;overflow:clip} /* clip, not hidden: hidden would make the map the tool row's scroll container and stop it sticking */
.mapwrap canvas{display:block;width:100%;height:auto;cursor:crosshair;border-radius:10px}
.maplegend{display:flex;flex-wrap:wrap;gap:10px 14px;padding:8px 10px;font-size:12px;color:var(--ink2)}
.maplegend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
/* The tool row and hint ride along the bottom of the screen while the (tall) aerial scrolls: a zero-height sticky strip at the end of the map,
   its content stacked upward from the bottom edge, never leaving the map (thumb reach on a phone; the green at the top stays uncovered). */
.maptop{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:2;height:0;margin:0 8px;display:flex;flex-direction:column;align-items:flex-end;justify-content:flex-end;gap:6px;pointer-events:none}
.maptop>*{pointer-events:auto}
.maptools{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.maptools button{background:rgba(255,255,255,.9);color:#17191c;border-color:transparent;font-size:12px;padding:4px 8px;backdrop-filter:blur(4px);touch-action:manipulation;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.maphint{font-size:12px;color:#fff;background:rgba(0,0,0,.6);padding:4px 8px;border-radius:6px;max-width:85%}
.maphint.fix{background:var(--plan);font-size:13px;font-weight:600}
@media (pointer:coarse){.maptools button{font-size:13px;padding:8px 9px}.maphint{font-size:13px;padding:6px 10px}}
.card h1{font-family:var(--num);font-weight:700;font-size:30px;line-height:1.05;margin:0}
.card h1 .meta{font:15px/1.3 var(--font);font-weight:400;color:var(--ink2);display:block;margin-top:6px}
.shot{margin:18px 0 10px;padding:16px 18px;border-left:4px solid var(--engine);background:var(--panel);border-radius:0 10px 10px 0}
.shot .big{font-family:var(--num);font-size:34px;line-height:1.05;font-weight:700}
.shot .big small{font-size:18px;font-weight:400;color:var(--ink2);margin-left:6px}
.shot .E{float:right;text-align:right;font-family:var(--num);font-size:34px;line-height:1.05;font-weight:700}
.shot .E small{display:block;font:12px/1.3 var(--font);color:var(--mute);font-weight:400}
.odds{display:flex;height:14px;border-radius:4px;overflow:hidden;margin:12px 0 6px;background:var(--panel2)}
.odds i{display:block;height:100%}
.oddsl{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink2)}
.oddsl span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;background:var(--c)}
.rows{margin:6px 0 0;font-size:14.5px}
.rows div{padding:5px 0;border-top:1px solid var(--rule);display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap}
.rows div:first-child{border-top:0}
.rows.rules div span:first-child{max-width:62ch;color:var(--ink2)}
.rows b{font-family:var(--num);font-weight:600;font-size:16px}
.go{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.go>div{padding:10px 12px;border:1px solid var(--rule);border-radius:8px}
.go>div.win{border-color:var(--engine);box-shadow:inset 0 0 0 1px var(--engine)}
.go .lbl{font-size:12px;color:var(--mute)}
.go .v{font-family:var(--num);font-size:26px;font-weight:700;line-height:1.1}
.go .d{font-size:13px;color:var(--ink2)}
h2{font-family:var(--num);font-weight:600;font-size:16px;letter-spacing:.02em;margin:22px 0 8px;color:var(--ink2)}
.plan{border-left:4px solid var(--plan);padding:10px 14px;background:var(--panel);border-radius:0 10px 10px 0;font-size:14.5px}
.plan .say{color:var(--ink)}
.plan .vs{margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--panel2);color:var(--ink2)}
.chip.ok{background:#e3f4e8;color:#1f6b33}.chip.bad{background:#fde7ea;color:#9b1024}.chip.new{background:#e8eefc;color:#1e3f9a}
:root[data-theme="dark"] .chip.ok{background:#1b3a25;color:#8fe0a4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.ok{background:#1b3a25;color:#8fe0a4}}
.plan details{margin-top:8px}.plan summary{cursor:pointer;color:var(--ink2);font-size:13px}
.plan p{margin:8px 0 0;color:var(--ink2);font-size:13.5px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;padding:6px 8px;border-bottom:1px solid var(--rule);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--rule);vertical-align:top}
td.n,th.n{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums}
tr.pick td{background:var(--panel)}
tr.pick td:first-child{box-shadow:inset 3px 0 0 var(--engine)}
.mini{display:inline-flex;height:8px;width:90px;border-radius:3px;overflow:hidden;background:var(--panel2);vertical-align:middle}
.mini i{display:block;height:100%}
.src{font-size:12.5px;color:var(--mute);margin-top:18px;line-height:1.5}
.profile{width:100%;height:110px;display:block;margin:4px 0 0}
.round table td,.round table th{padding:7px 8px}
.round .tot{font-family:var(--num);font-size:18px;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:12px 0 18px}
.kpi{padding:12px 14px;background:var(--panel);border-radius:10px}
.kpi .v{font-family:var(--num);font-size:30px;font-weight:700;line-height:1.05}
.kpi .l{font-size:12.5px;color:var(--mute);margin-top:4px}
.kpi.engine .v{color:var(--engine)}.kpi.plan .v{color:var(--plan)}
.audit li{padding:10px 0;border-top:1px solid var(--rule);list-style:none}
.audit ul{padding:0;margin:0}
.audit .imp{float:right;font-family:var(--num);font-weight:700;font-size:18px;color:var(--engine)}
.audit .where{font-weight:600}
.audit .ev{color:var(--ink2);font-size:13.5px;margin-top:3px}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;max-width:1100px}
.settings section{padding:14px 16px;background:var(--panel);border-radius:10px}
.settings h3{margin:0 0 8px;font-family:var(--num);font-size:17px;font-weight:600}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--rule);font-size:14px}
.settings label:first-of-type{border-top:0}
.settings input[type=number],.settings select{width:110px;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);text-align:right}
.settings input[type=range]{width:150px}
.settings textarea{width:100%;height:120px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:8px;font:13px/1.4 ui-monospace,Consolas,monospace}
.settings .help{font-size:12.5px;color:var(--mute);margin:6px 0 0}
.clubs td input{width:58px;padding:3px 6px;border:1px solid var(--rule);border-radius:4px;background:var(--paper);text-align:right}
@media (max-width:560px){.clubs th,.clubs td{padding:5px 4px}.clubs td input{width:50px;padding:3px 4px}.clubs{font-size:13px}}
/* Play mode: the round's controls ride the bottom strip with the map tools (thumb reach), in the engine's red so they read as "live" */
.playtools{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.playtools button{background:rgba(200,16,46,.92);color:#fff;border-color:transparent;font-size:12.5px;font-weight:600;padding:5px 10px;backdrop-filter:blur(4px);touch-action:manipulation;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.playtools button.quiet{background:rgba(255,255,255,.92);color:#17191c;font-weight:400}
.playtools button:disabled{opacity:.55;cursor:default}
@media (pointer:coarse){.playtools button{font-size:13.5px;padding:9px 11px}}
.marks{margin:6px 0 0;font-size:13.5px}
.marks div.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--rule)}
.marks div.row:first-child{border-top:0}
.marks .n{font-family:var(--num);font-weight:700;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.marks select,.marks input{padding:2px 5px;border:1px solid var(--rule);border-radius:5px;background:var(--paper);font-size:12.5px;max-width:120px}
.marks .sg{margin-left:auto;font-family:var(--num);font-weight:700}
.marks .sub{width:100%;font-size:12.5px;color:var(--mute);padding-left:30px}
.marks button.x{padding:1px 7px;font-size:12px;color:var(--mute)}
.holed{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;padding:10px 12px;background:var(--panel2);border-radius:8px}
.holed input{width:60px;padding:5px 8px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);text-align:right;font-family:var(--num);font-size:16px}
.rounds h1{font-family:var(--num);font-size:28px;margin:4px 0 2px}
.rounds .banner{display:flex;gap:10px 16px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-left:4px solid var(--engine);background:var(--panel);border-radius:0 10px 10px 0;margin:10px 0 16px}
.rounds .list div.r,.swingv .list div.r{display:flex;gap:8px 16px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--rule)}
.rounds .list div.r:first-child,.swingv .list div.r:first-child{border-top:0}
.rounds .list .when,.swingv .list .when{font-family:var(--num);font-weight:600;min-width:96px}
.rounds .list .sgv{font-family:var(--num);font-weight:700;font-size:18px;min-width:60px;text-align:right}
.rounds .list .tools,.swingv .list .tools{margin-left:auto;display:flex;gap:6px}
.rounds .list .tools button,.swingv .list .tools button{padding:3px 9px;font-size:12.5px}
.catbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:10px 0 16px}
.catbar>div{padding:8px 10px;background:var(--panel);border-radius:8px}
.catbar .v{font-family:var(--num);font-size:22px;font-weight:700;line-height:1.1}
.catbar .v.neg{color:var(--engine)}.catbar .v.pos{color:var(--ok)}
.catbar .l{font-size:12px;color:var(--mute)}
.rev{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px;margin:8px 0 18px}
.rev section{padding:12px 14px;background:var(--panel);border-radius:10px}
.rev h3{margin:0 0 6px;font-family:var(--num);font-size:15px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.rev h3 .cf{font:11px var(--font);color:var(--mute);font-weight:400;white-space:nowrap}
.rev p{margin:4px 0 0;font-size:13.5px;color:var(--ink2)}
.spark{width:100%;height:60px;display:block}
.sample{border:1px dashed var(--plan);border-radius:8px;padding:10px 12px;font-size:13.5px;color:var(--ink2)}
.progress{font-size:12.5px;color:var(--mute);margin:4px 0 10px}
.empty{padding:40px;text-align:center;color:var(--mute)}
/* Swing view (Omega G): sessions from the swing harness, me vs me, the experiments and the evidence */
.swingv h1{font-family:var(--num);font-size:28px;margin:4px 0 2px}
.swingv .lede{color:var(--ink2);max-width:76ch;margin:0 0 12px}
.ev{display:inline-block;font:600 10.5px/1.6 var(--font);letter-spacing:.04em;padding:0 6px;border-radius:4px;vertical-align:1px;white-space:nowrap}
.ev.OBSERVED{background:#e3f4e8;color:#1f6b33}.ev.ESTIMATED{background:#e8eefc;color:#1e3f9a}.ev.INFERRED{background:#fff1d6;color:#7a4b00}.ev.PREDICTED{background:#f2e6fb;color:#5b2a86}.ev.UNKNOWN{background:var(--panel2);color:var(--mute)}
:root[data-theme="dark"] .ev.OBSERVED{background:#1b3a25;color:#8fe0a4}:root[data-theme="dark"] .ev.ESTIMATED{background:#1d2b4f;color:#a9c0ff}:root[data-theme="dark"] .ev.INFERRED{background:#3d2c0a;color:#ffd27a}:root[data-theme="dark"] .ev.PREDICTED{background:#33204a;color:#dcb8ff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ev.OBSERVED{background:#1b3a25;color:#8fe0a4}:root:not([data-theme="light"]) .ev.ESTIMATED{background:#1d2b4f;color:#a9c0ff}:root:not([data-theme="light"]) .ev.INFERRED{background:#3d2c0a;color:#ffd27a}:root:not([data-theme="light"]) .ev.PREDICTED{background:#33204a;color:#dcb8ff}}
.swingv table td .sub{display:block;font-size:12px;color:var(--mute)}
.figs{display:flex;gap:4px;flex-wrap:wrap;margin:6px 0 10px}
.figs figure{margin:0;text-align:center;font-size:11px;color:var(--mute)}
.figs svg{width:76px;height:92px;background:var(--panel);border-radius:6px;display:block}
.hyp{padding:12px 14px;background:var(--panel);border-radius:10px;margin:0 0 10px}
.hyp .st{font-family:var(--num);font-weight:700}
.hyp .st.supported{color:var(--ok)}.hyp .st.insufficient{color:var(--mute)}.hyp .st.not{color:var(--engine)}
.today{margin:14px 0 10px;padding:12px 14px;border-left:4px solid #b26a00;background:var(--panel);border-radius:0 10px 10px 0;font-size:14px}
.today b{font-family:var(--num)}
.today .why{font-size:12.5px;color:var(--ink2);margin-top:4px}
.swingv textarea{width:100%;height:80px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:8px;font:12px/1.4 ui-monospace,Consolas,monospace}
.swingv .row{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;margin:6px 0}
.swingv select,.swingv input[type=text],.swingv input[type=date]{padding:4px 6px;border:1px solid var(--rule);border-radius:6px;background:var(--paper)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 14px;border-radius:8px;font-size:13.5px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.pocket{display:none}
@media print{
  header,.mapwrap,.maplegend,.progress,nav,.noprint{display:none!important}
  html,body{font-size:11px;color:#000;background:#fff}
  main{padding:0;max-width:none}
  .pocket{display:block}
  .pocket table{font-size:10.5px}.pocket td,.pocket th{padding:3px 5px;border-bottom:1px solid #999}
  .pocket h1{font:700 18px var(--num);margin:0 0 4px}
  .pocket .sub{font-size:10px;color:#333;margin-bottom:6px}
  .round:not(.printing),.audit,.settings,.hole{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="wordmark">Loop<small>the caddie built from your data</small></div>
    <select class="course" id="courseSel" aria-label="Course"></select>
    <button class="cond" id="condChip" aria-expanded="false" title="Today's conditions"></button>

    const j = await res.json(); const cur = j.current || {};
    if (cur.wind_speed_10m == null || cur.wind_direction_10m == null || cur.temperature_2m == null) throw new Error("no current conditions in the reply");
    $("#q_wind").value = Math.round(cur.wind_speed_10m); $("#q_from").value = Math.round(cur.wind_direction_10m / 5) * 5; $("#q_temp").value = Math.round(cur.temperature_2m);
    const when = String(cur.time || "").replace("T", " "); state.forecastNote = `forecast for ${c.name} at ${when} (Open-Meteo, 10-m wind${cur.wind_gusts_10m != null ? `, gusts ${Math.round(cur.wind_gusts_10m)} mph` : ""})`;
    src.textContent = `${Math.round(cur.wind_speed_10m)} mph from ${Math.round(cur.wind_direction_10m)}°${cur.wind_gusts_10m != null ? `, gusts ${Math.round(cur.wind_gusts_10m)}` : ""}, ${Math.round(cur.temperature_2m)}°F at ${when} — press Apply`;
  } catch (e) { src.textContent = "Could not reach the forecast (" + e.message + "); set the wind by hand."; }
  b.disabled = false; b.textContent = "Use the forecast";
}
$("#q_forecast").addEventListener("click", useForecast);
$("#q_apply").addEventListener("click", () => { state.P.wind_mph = +$("#q_wind").value || 0; state.P.wind_from = +$("#q_from").value || 0; state.P.temp_f = +$("#q_temp").value || 75; state.P.setting = $("#q_turf").value; state.P.pin = $("#q_pin").value; state.P.pin_lat = +$("#q_pinlat").value || 0; state.condNote = state.forecastNote || null; state.forecastNote = null; $("#q_fsrc").textContent = ""; $("#quick").hidden = true; $("#condChip").setAttribute("aria-expanded","false"); saveP(); toast("Conditions applied: " + windText() + ", " + state.P.temp_f + "°F, " + state.P.setting + ", " + pinText() + (state.condNote ? " — from the " + state.condNote : "")); });
$("#courseSel").addEventListener("change", ev => { state.course = ev.target.value; store.set("course", state.course); state.hole = 1; store.set("hole", 1); state.tap = null; renderHeader(); setView(state.view); startBackground(); });
$("#holeStrip").addEventListener("click", ev => { const b = ev.target.closest("button[data-hole]"); if (!b) return; state.hole = +b.dataset.hole; store.set("hole", state.hole); state.tap = null; state.holedOpen = false; setFixMode(false); state.markMode = false; $("#clearTap").style.display="none"; renderHeader(); if (state.view!=="hole") setView("hole"); else renderHole(); });
$$("nav.views button").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
document.addEventListener("keydown", ev => { if (ev.target.matches("input,select,textarea")) return; if (ev.key==="ArrowRight"||ev.key==="ArrowLeft") { const c=course(); const i = c.holes.findIndex(h=>h.hole===state.hole); const j = Math.max(0, Math.min(c.holes.length-1, i + (ev.key==="ArrowRight"?1:-1))); state.hole = c.holes[j].hole; store.set("hole", state.hole); state.tap=null; renderHeader(); if (state.view==="hole") renderHole(); } });
// boot
if (IN_ARTIFACT || !navigator.geolocation) { $("#gpsBtn").style.display = "none"; }
if (IN_ARTIFACT || typeof fetch !== "function") { $("#q_forecast").style.display = "none"; }   // the artifact frame refuses fetch
renderHeader(); setView("hole"); startBackground();
})();
</script>
<script>if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(()=>{}); navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.type === "loop-reload") location.reload(); }); }</script>
